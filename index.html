<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-Reports</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #102a36;
      background: #f4f7f9;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 640px);
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(2rem, 6vw, 3rem);
    }

    .choice {
      display: block;
      padding: 28px 32px;
      border: 2px solid #1f6f8b;
      border-radius: 16px;
      color: #fff;
      background: #1f6f8b;
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(16, 42, 54, 0.14);
    }

    .choice:hover,
    .choice:focus-visible {
      background: #164f63;
      border-color: #164f63;
    }

    .choice:focus-visible {
      outline: 4px solid #9fd2e1;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Self-Reports</h1>
    <a class="choice" href="MCS/">MCS SELF-REPORTS</a>
  </main>
</body>
</html>
