name: Apply DACSS Current Impact update

on:
  push:
    branches: [main]
    paths:
      - dacss-current-impact.tar.gz

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install DACSS Current Impact update
        run: |
          tar -xzf dacss-current-impact.tar.gz
          git rm -f dacss-current-impact.tar.gz .github/workflows/apply-dacss-impact.yml
          git add MCS/MCSdx/index.html MCS/MCSdx/css/styles.css MCS/MCSdx/js/app.js MCS/MCSdx/data/list.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add required DACSS Current Impact scores"
          git push
