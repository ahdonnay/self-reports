name: Apply DACSS responsive impact fix

on:
  push:
    branches: [main]
    paths:
      - dacss-layout-fix.tar.gz

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install DACSS responsive impact fix
        run: |
          tar -xzf dacss-layout-fix.tar.gz
          git rm -f dacss-layout-fix.tar.gz .github/workflows/apply-dacss-layout-fix.yml
          git add MCS/MCSdx/index.html MCS/MCSdx/css/styles.css MCS/MCSdx/js/app.js MCS/MCSdx/data/list.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix DACSS Current Impact responsive layout"
          git push
