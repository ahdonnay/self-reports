name: Apply BAACSS presentation edits

on:
  push:
    branches: [main]
    paths:
      - baacss-tweaks.tar.gz

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BAACSS presentation edits
        run: |
          tar -xzf baacss-tweaks.tar.gz
          git rm -f baacss-tweaks.tar.gz .github/workflows/apply-baacss-tweaks.yml
          git add MCS/MCSbm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refine BAACSS labels and dashboard"
          git push
