name: Publish shorter TRACTSS reason labels

on:
  push:
    branches: [main]
    paths:
      - tractss-labels.tar.gz

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shorter TRACTSS reason labels
        run: |
          tar -xzf tractss-labels.tar.gz
          git rm -f tractss-labels.tar.gz .github/workflows/apply-tractss-labels.yml
          git add MCS/MCStm/index.html MCS/MCStm/data/list.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Shorten TRACTSS stopping reason labels"
          git push
