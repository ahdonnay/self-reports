name: Apply self-reports reorganization

on:
  push:
    branches:
      - main
    paths:
      - reorganization.tar.gz

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reorganized site
        shell: bash
        run: |
          rm -rf README.md css data js status.html tools
          tar -xzf reorganization.tar.gz
          git rm reorganization.tar.gz .github/workflows/apply-reorganization.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Organize self-reports into MCS and CO suites"
          git push
