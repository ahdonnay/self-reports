name: Apply BAACSS release

on:
  push:
    branches: [main]
    paths:
      - baacss-publish.tar.gz

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BAACSS files
        run: |
          tar -xzf baacss-publish.tar.gz
          git rm -f baacss-publish.tar.gz .github/workflows/apply-baacss.yml
          git add MCS/MCSbm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build BAACSS biomarker self-report"
          git push
