name: Publish compact TRACTSS reason buttons

on:
  push:
    branches: [main]
    paths:
      - tractss-compact-reasons.tar.gz

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compact TRACTSS reason buttons
        run: |
          tar -xzf tractss-compact-reasons.tar.gz
          git rm -f tractss-compact-reasons.tar.gz .github/workflows/apply-tractss-compact-reasons.yml
          git add MCS/MCStm/index.html MCS/MCStm/css/styles.css MCS/MCStm/js/app.js MCS/MCStm/data/list.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Compact TRACTSS stopping reason buttons"
          git push
